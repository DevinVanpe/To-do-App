<!DOCTYPE html>
<html lang="en">
<head>
    <!-- <head> contains metadata, not visible content: Character Encoding / Page Title / CSS Link -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title -->
    <title>Todo App</title>

    <!-- This links the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- App Title -->
    <h1>My To-do List</h1>
    
    <!--
    Add Todo (form captures user input).
    Submitting the form triggers JavaScript logic.
    -->
     <form id="todo-form">
        <input id="todo-input" type="text" placeholder="Add a new task..." />
        <button>Add</button>
     </form>

     <!-- Filters -->
      <div id="filters">
        <button data-filter="all">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="completed">Completed</button>
    </div>

     <!-- Todos list container -->
    <ul id="todo-list"></ul>

    <!-- Load JavaScript AFTER HTML exists -->
    <script src="script.js"></script>
</body>
</html>
